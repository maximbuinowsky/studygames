<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — Study Games</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/catalog.css">
    <script src="js/script.js" defer></script>
    <script src="js/catalog.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="logo" href="index.html">
            <img src="preview(head).png" alt="Study Games — на главную" width="300" height="100">
        </a>

        <form class="search" role="search" action="catalog.html">
            <input type="search" id="search-input" name="q"
                   placeholder="Поиск игры…" aria-label="Поиск игры">
        </form>

        <button class="burger" id="burger" type="button"
                aria-label="Открыть меню" aria-expanded="false" aria-controls="main-nav">☰</button>

        <nav class="main-nav" id="main-nav">
            <a href="index.html">Главная</a>
            <a href="catalog.html" aria-current="page">Каталог</a>
            <a href="guarantees.html">Гарантии</a>
            <a href="help.html">Помощь</a>
            <a href="cabinet.html">Личный кабинет</a>
            <a href="cart.html" class="cart-link">Корзина <span class="cart-count" id="cart-count">0</span></a>
        </nav>
    </header>

    <main>
        <h1>Каталог игр</h1>

        <label>
            Платформа:
            <select id="platform">
                <option value="all">Все</option>
                <option value="Steam">Steam</option>
                <option value="GOG">GOG</option>
                <option value="Epic Games">Epic Games</option>
            </select>
        </label>

        <div class="games">

            <div class="card" data-platform="GOG">
                <div class="cover" style="background-image: url('img/neon drift.png'); background-size: cover; background-position: center;"></div>
                <h3>Neon Drift</h3>
                <p>Платформа: GOG</p>
                <p>Жанр: Гонки</p>
                <p class="price">1.99 $</p>
                <button>В корзину</button>
            </div>

            <div class="card" data-platform="Steam">
                <div class="cover" style="background-image: url('img/elden ring.webp'); background-size: cover; background-position: center;"></div>
                <h3>Elden Ring</h3>
                <p>Платформа: Steam</p>
                <p>Жанр: RPG</p>
                <p class="price">59.99 $</p>
                <button>В корзину</button>
            </div>

            <div class="card" data-platform="Epic Games">
                <div class="cover" style="background-image: url('img/star vault.jpg'); background-size: cover; background-position: center;"></div>
                <h3>Star Vault</h3>
                <p>Платформа: Epic Games</p>
                <p>Жанр: Стратегия</p>
                <p class="price">24.99 $</p>
                <button>В корзину</button>
            </div>

            <div class="card" data-platform="Steam">
                <div class="cover" style="background-image: url('img/arc raiders.jpg'); background-size: cover; background-position: center;"></div>
                <h3>Arc Raiders</h3>
                <p>Платформа: Steam</p>
                <p>Жанр: Экшен</p>
                <p class="price">39.99 $</p>
                <button>В корзину</button>
            </div>

        </div>
    </main>
</body>
</html>
